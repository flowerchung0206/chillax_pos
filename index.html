<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>蕎淶清飲 x 華夫格格 - 展場 POS 結帳系統</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            user-select: none; /* 防止展場快速點擊時反白文字 */
        }
        body {
            background-color: #eef2f5;
            color: #333;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }
        
        /* 左側商品區 */
        .product-section {
            flex: 2;
            display: flex;
            flex-direction: column;
            background: #eef2f5;
            padding: 16px;
        }
        
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }
        
        .header h1 {
            font-size: 22px;
            color: #2b580c;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .header-info {
            font-size: 14px;
            color: #666;
            background: #fff;
            padding: 8px 16px;
            border-radius: 20px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }

        .category-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 16px;
            overflow-x: auto;
            padding-bottom: 4px;
        }

        .tab {
            padding: 12px 24px;
            background: #fff;
            border-radius: 8px;
            font-weight: bold;
            color: #555;
            cursor: pointer;
            border: 1px solid #ddd;
            white-space: nowrap;
            transition: 0.2s;
        }

        .tab.active {
            background: #4e8724;
            color: #fff;
            border-color: #4e8724;
            box-shadow: 0 4px 8px rgba(78, 135, 36, 0.2);
        }

        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 16px;
            overflow-y: auto;
            flex: 1;
            align-content: start;
        }

        .product-card {
            background: #fff;
            border-radius: 12px;
            padding: 16px;
            text-align: center;
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            border: 1px solid #eee;
            transition: transform 0.1s, box-shadow 0.1s;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            height: 120px;
        }

        .product-card:active {
            transform: scale(0.95);
            box-shadow: 0 1px 4px rgba(0,0,0,0.1);
            border-color: #4e8724;
        }

        .product-card.waffle {
            border-left: 4px solid #f39c12;
        }
        .product-card.tea {
            border-left: 4px solid #4e8724;
        }
        .product-card.milk {
            border-left: 4px solid #3498db;
        }

        .product-name {
            font-size: 15px;
            font-weight: bold;
            color: #333;
            line-height: 1.3;
        }

        .product-price {
            font-size: 16px;
            color: #e74c3c;
            font-weight: bold;
        }

        /* 右側購物車結帳區 */
        .cart-section {
            flex: 1;
            min-width: 320px;
            max-width: 400px;
            background: #fff;
            display: flex;
            flex-direction: column;
            border-left: 1px solid #ddd;
            box-shadow: -2px 0 10px rgba(0,0,0,0.05);
        }

        .cart-header {
            background: #2c3e50;
            color: white;
            padding: 16px;
            text-align: center;
            font-size: 18px;
            font-weight: bold;
        }

        .cart-items {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
        }

        .cart-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 10px;
            border-bottom: 1px dashed #eee;
        }

        .cart-item-info {
            flex: 1;
        }

        .cart-item-name {
            font-size: 15px;
            font-weight: bold;
            color: #333;
        }

        .cart-item-options {
            font-size: 12px;
            color: #888;
            margin-top: 4px;
        }

        .cart-item-qty {
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 0 15px;
        }

        .qty-btn {
            width: 28px;
            height: 28px;
            background: #f0f0f0;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            color: #555;
        }

        .cart-item-price {
            font-weight: bold;
            color: #333;
            min-width: 50px;
            text-align: right;
        }

        .cart-summary {
            padding: 16px;
            background: #fafafa;
            border-top: 1px solid #eee;
        }

        .summary-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-size: 14px;
            color: #555;
        }

        .summary-total {
            display: flex;
            justify-content: space-between;
            margin-top: 12px;
            padding-top: 12px;
            border-top: 2px solid #ddd;
            font-size: 24px;
            font-weight: bold;
            color: #2b580c;
        }

        .quick-cash {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            padding: 0 16px 16px;
            background: #fafafa;
        }

        .cash-btn {
            padding: 10px;
            background: #fff;
            border: 1px solid #ccd1d9;
            border-radius: 6px;
            font-size: 14px;
            font-weight: bold;
            color: #333;
            cursor: pointer;
        }

        .cash-btn:active {
            background: #e6e9ed;
        }

        .action-buttons {
            display: flex;
            padding: 16px;
            gap: 10px;
            background: #fff;
        }

        .btn-cancel {
            flex: 1;
            padding: 16px;
            background: #e74c3c;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .btn-checkout {
            flex: 2;
            padding: 16px;
            background: #4e8724;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(78, 135, 36, 0.3);
        }

        .btn-checkout:active, .btn-cancel:active {
            opacity: 0.9;
            transform: scale(0.98);
        }
        
        /* 針對小平板的調整 */
        @media (max-width: 768px) {
            body {
                flex-direction: column;
            }
            .cart-section {
                max-width: 100%;
                height: 50vh;
                border-left: none;
                border-top: 1px solid #ddd;
            }
            .product-section {
                height: 50vh;
            }
        }
    </style>
</head>
<body>

    <!-- 左側商品區 -->
    <div class="product-section">
        <div class="header">
            <h1>🖥️ 蕎淶清飲 x 華夫格格 展場 POS</h1>
            <div class="header-info">
                收銀員：花花 | 2026/08/01 10:30
            </div>
        </div>

        <div class="category-tabs">
            <div class="tab active">全部商品</div>
            <div class="tab">熱銷鬆餅 (華夫格格)</div>
            <div class="tab">清爽純茶</div>
            <div class="tab">特調奶香</div>
        </div>

        <div class="product-grid">
            <!-- 鬆餅類 -->
            <div class="product-card waffle">
                <div class="product-name">原味比利時珍珠糖鬆餅</div>
                <div class="product-price">$55</div>
            </div>
            <div class="product-card waffle">
                <div class="product-name">濃情巧克力鬆餅</div>
                <div class="product-price">$65</div>
            </div>
            
            <!-- 茶飲類 -->
            <div class="product-card tea">
                <div class="product-name">招牌清香烏龍</div>
                <div class="product-price">$55</div>
            </div>
            <div class="product-card tea">
                <div class="product-name">四季春青茶</div>
                <div class="product-price">$50</div>
            </div>
            
            <!-- 奶香特調 -->
            <div class="product-card milk">
                <div class="product-name">盧哈娜拿鐵鮮奶茶</div>
                <div class="product-price">$75</div>
            </div>
            <div class="product-card milk">
                <div class="product-name">泰式奶茶</div>
                <div class="product-price">$70</div>
            </div>
            <div class="product-card milk">
                <div class="product-name">手作黑糖珍珠鮮奶</div>
                <div class="product-price">$70</div>
            </div>
            <div class="product-card tea">
                <div class="product-name">百香果雙響炮</div>
                <div class="product-price">$65</div>
            </div>
        </div>
    </div>

    <!-- 右側結帳區 -->
    <div class="cart-section">
        <div class="cart-header">目前訂單 #001</div>
        
        <div class="cart-items">
            <div class="cart-item">
                <div class="cart-item-info">
                    <div class="cart-item-name">原味比利時珍珠糖鬆餅</div>
                    <div class="cart-item-options">現烤</div>
                </div>
                <div class="cart-item-qty">
                    <button class="qty-btn">-</button>
                    <span>2</span>
                    <button class="qty-btn">+</button>
                </div>
                <div class="cart-item-price">$110</div>
            </div>
            
            <div class="cart-item">
                <div class="cart-item-info">
                    <div class="cart-item-name">盧哈娜拿鐵鮮奶茶</div>
                    <div class="cart-item-options">微冰 / 微糖</div>
                </div>
                <div class="cart-item-qty">
                    <button class="qty-btn">-</button>
                    <span>1</span>
                    <button class="qty-btn">+</button>
                </div>
                <div class="cart-item-price">$75</div>
            </div>
        </div>

        <div class="cart-summary">
            <div class="summary-row">
                <span>小計 (3件)</span>
                <span>$185</span>
            </div>
            <div class="summary-row">
                <span>展場折扣</span>
                <span>-$0</span>
            </div>
            <div class="summary-total">
                <span>應收總額</span>
                <span>$185</span>
            </div>
        </div>

        <div class="quick-cash">
            <button class="cash-btn">$200</button>
            <button class="cash-btn">$500</button>
            <button class="cash-btn">$1000</button>
            <button class="cash-btn">剛好</button>
        </div>

        <div class="action-buttons">
            <button class="btn-cancel" onclick="alert('已清空訂單')">清空</button>
            <button class="btn-checkout" onclick="alert('結帳成功！請準備出單。')">現金結帳</button>
        </div>
    </div>

</body>
</html>
