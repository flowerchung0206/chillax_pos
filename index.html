<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>蕎淶清飲 智能 POS (奶茶色質感觸控鍵盤版)</title>
  <!-- 引入 SheetJS 用於匯出真正的 .xlsx 檔案 -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    /* 奶茶色高級質感色系 */
    body { 
      font-family: '微軟正黑體', sans-serif; 
      background-color: #f7f3ee; 
      color: #4a403b;
      margin: 0; 
      padding: 15px; 
      display: flex; 
      gap: 15px; 
      height: 100vh; 
      overflow: hidden; 
    }
    .panel { 
      background: #fffcf9; 
      padding: 22px; 
      border-radius: 16px; 
      box-shadow: 0 6px 18px rgba(110, 90, 75, 0.08); 
      border: 1px solid #e8dfd8;
      flex: 1; 
      display: flex; 
      flex-direction: column; 
      height: 100%; 
      overflow-y: auto; 
    }
    h2 { 
      color: #6d5d53; 
      font-size: 1.5rem; 
      border-bottom: 2px solid #e8dfd8; 
      padding-bottom: 12px; 
      margin-top: 15px; 
      margin-bottom: 15px; 
    }
    h1 { 
      font-size: 2rem; 
      cursor: pointer; 
      color: #5c4b42; 
      user-select: none; 
      transition: 0.3s; 
      margin: 0 0 8px 0; 
    }
    h1:active { color: #b08d79; }
    
    /* 奶茶色系 iPad 特大觸控按鈕 */
    .btn { 
      padding: 16px 20px; 
      margin: 8px; 
      border: none; 
      border-radius: 12px; 
      cursor: pointer; 
      font-size: 1.3rem; 
      transition: 0.2s; 
      box-shadow: 0 3px 6px rgba(110, 90, 75, 0.06); 
      font-weight: bold; 
    }
    .btn-pizza { background: #f4eae1; color: #8c5830; border: 2px solid #dfc7b5; }
    .btn-drink { background: #e3edf5; color: #3b5973; border: 2px solid #cbdde9; }
    .btn-snack { background: #f0e6ef; color: #734f6e; border: 2px solid #e0cbe0; }
    .btn:active { transform: scale(0.96); }
    
    .menu-grid { display: flex; flex-wrap: wrap; gap: 12px; }
    .menu-item-wrap { display: inline-flex; align-items: center; background: #fff8f3; padding: 8px 12px; border-radius: 12px; border: 2px solid #ebdcd0; }
    
    .cart-item, .queue-item { display: flex; justify-content: space-between; padding: 16px 0; border-bottom: 1px dashed #dfd0c4; align-items: center; font-size: 1.3rem; }
    .price-input { width: 90px; display: none; padding: 8px; margin-left: 8px; border: 2px solid #b09f92; border-radius: 8px; text-align: center; font-size: 1.3rem; }
    .edit-mode .price-text { display: none; }
    .edit-mode .price-input { display: inline-block; }
    
    .checkout-zone { margin-top: auto; background: #f4ede6; padding: 22px; border-radius: 14px; border: 2px solid #e2d3c7; }
    .checkout-zone input { font-size: 1.5rem; padding: 10px; width: 150px; border-radius: 8px; border: 2px solid #b8a698; text-align: center; background: #fffcf9; color: #4a403b; }
    .total-price { font-size: 2rem; color: #a65d37; font-weight: bold; }
    
    .queue-item { background: #fffcf9; margin-bottom: 12px; padding: 16px; border-radius: 12px; border-left: 6px solid #b08d79; box-shadow: 0 2px 5px rgba(110, 90, 75, 0.05); border-top: 1px solid #f0e6df; border-right: 1px solid #f0e6df; border-bottom: 1px solid #f0e6df; transition: 0.3s;}
    .queue-done { opacity: 0.5; border-left: 6px solid #85a38b; text-decoration: line-through; background: #f0f5f1; }
    .export-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; background: #f4ede6; padding: 15px 18px; border-radius: 12px; border: 2px solid #e2d3c7; }

    /* 奶茶色專屬自訂數字鍵盤彈窗 */
    #numpadOverlay {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(74, 64, 59, 0.4);
      z-index: 999;
      justify-content: center;
      align-items: center;
    }
    .numpad-box {
      background: #fffcf9;
      padding: 24px;
      border-radius: 18px;
      box-shadow: 0 10px 30px rgba(110, 90, 75, 0.2);
      border: 2px solid #e2d3c7;
      width: 340px;
    }
    .numpad-display {
      font-size: 2rem;
      text-align: right;
      background: #f4ede6;
      padding: 12px 18px;
      border-radius: 10px;
      margin-bottom: 18px;
      color: #a65d37;
      font-weight: bold;
      border: 2px solid #d2c2b4;
    }
    .numpad-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
    }
    .num-btn {
      background: #f4eae1;
      border: 2px solid #dfc7b5;
      color: #5c4b42;
      font-size: 1.6rem;
      padding: 18px 0;
      border-radius: 12px;
      cursor: pointer;
      font-weight: bold;
      transition: 0.1s;
    }
    .num-btn:active { background: #e6d5c5; transform: scale(0.95); }
    .num-btn-action { background: #e2d3c7; color: #4a403b; }
    .num-btn-ok { background: #9c7b66; color: white; border-color: #8c6a56; grid-column: span 3; }
  </style>
</head>
<body>

  <!-- 左側：點餐區 -->
  <div class="panel" id="menuPanel">
    <div>
      <h1 id="brandTitle" onclick="checkUnlock()">☕ 蕎淶清飲 POS</h1>
      <span style="font-size: 1rem; color: #8c7a6b;">(連續點擊標題 5 下解鎖價格修改)</span>
    </div>
    
    <h2>🍕 比薩</h2>
    <div class="menu-grid" id="pizzaMenu"></div>
    
    <h2>🥤 飲料</h2>
    <div class="menu-grid" id="drinkMenu"></div>
    
    <h2>🍰 甜點</h2>
    <div class="menu-grid" id="snackMenu"></div>
  </div>

  <!-- 中間：購物車與結帳區 -->
  <div class="panel">
    <h2>🛒 購物車</h2>
    <div style="flex: 1; overflow-y: auto;" id="cartList">
      <p style="color: #a39283; text-align: center; margin-top: 60px; font-size: 1.3rem;">尚未選擇商品</p>
    </div>
    
    <div class="checkout-zone">
      <div style="display: flex; justify-content: space-between; margin-bottom: 12px; align-items: center;">
        <span style="font-size: 1.2rem; font-weight: bold; color: #7c685b;">🏷️ 比薩+飲料套組折扣</span>
        <span style="font-size: 1.1rem; color: #a65d37; font-weight: bold;" id="comboHint">未達比薩+飲料組合</span>
      </div>
      <div style="display: flex; justify-content: space-between; margin-bottom: 12px; align-items: center;">
        <span style="font-size: 1.3rem;">總計金額:</span>
        <span class="total-price">$<span id="totalAmount">0</span></span>
      </div>
      <div style="display: flex; justify-content: space-between; margin-bottom: 12px; align-items: center;">
        <span style="font-size: 1.3rem;">客收現金:</span>
        <div style="display: flex; gap: 10px; align-items: center;">
          <!-- 設定 readonly 防止平板原生鍵盤彈出 -->
          <input type="text" id="cashGiven" placeholder="點擊輸入" readonly onclick="openNumpad()">
          <button class="btn" style="background: #85a38b; color: white; padding: 12px 18px; font-size: 1.2rem;" onclick="setExactCash()">⚡ 不找零</button>
        </div>
      </div>
      <div style="display: flex; justify-content: space-between; margin-bottom: 18px; font-weight: bold; align-items: center;">
        <span style="font-size: 1.3rem;">找零:</span>
        <span id="changeAmount" style="color: #6b8c73; font-size: 1.7rem;">$0</span>
      </div>
      <button class="btn" style="background: #9c7b66; color: white; width: 100%; padding: 16px; font-size: 1.4rem;" onclick="checkout()">確認結帳並送單</button>
    </div>
  </div>

  <!-- 右側：訂單列隊與營運匯出區 -->
  <div class="panel">
    <div class="export-bar">
      <div>
        <div style="font-weight: bold; color: #5c4b42; font-size: 1.2rem;">📊 營運統計與匯出</div>
        <div style="font-size: 1.05rem; color: #7c685b; margin-top: 4px;" id="dailyStatsHint">今日營業額: $0 | 總單數: 0 單</div>
      </div>
      <div style="display: flex; gap: 8px;">
        <button class="btn" style="background: #879ab0; color: white; padding: 10px 14px; font-size: 1.1rem;" onclick="exportExcel()">匯出 Excel</button>
        <button class="btn" style="background: #b87b76; color: white; padding: 10px 14px; font-size: 1.1rem;" onclick="clearHistory()">清空歷史</button>
      </div>
    </div>

    <h2>📋 即時訂單列隊</h2>
    <div style="flex: 1; overflow-y: auto;" id="queueList">
      <p style="color: #a39283; text-align: center; margin-top: 60px; font-size: 1.3rem;">目前尚無訂單</p>
    </div>
  </div>

  <!-- 奶茶色自訂數字鍵盤彈窗 -->
  <div id="numpadOverlay" onclick="closeNumpadBg(event)">
    <div class="numpad-box">
      <div style="font-weight: bold; margin-bottom: 8px; color: #6d5d53; font-size: 1.2rem;">⌨️ 輸入客收現金金額</div>
      <div class="numpad-display" id="numpadVal">0</div>
      <div class="numpad-grid">
        <button class="num-btn" onclick="numPress('7')">7</button>
        <button class="num-btn" onclick="numPress('8')">8</button>
        <button class="num-btn" onclick="numPress('9')">9</button>
        <button class="num-btn" onclick="numPress('4')">4</button>
        <button class="num-btn" onclick="numPress('5')">5</button>
        <button class="num-btn" onclick="numPress('6')">6</button>
        <button class="num-btn" onclick="numPress('1')">1</button>
        <button class="num-btn" onclick="numPress('2')">2</button>
        <button class="num-btn" onclick="numPress('3')">3</button>
        <button class="num-btn num-btn-action" onclick="numPress('0')">0</button>
        <button class="num-btn num-btn-action" onclick="numDelete()">⌫</button>
        <button class="num-btn num-btn-action" onclick="numClear()">清除</button>
        <button class="num-btn num-btn-ok" onclick="confirmNumpad()">確定</button>
      </div>
    </div>
  </div>

  <script>
    let menuData = JSON.parse(localStorage.getItem('qiaolai_menuData')) || {
      pizza: [
        { name: "海鮮比薩", price: 80, type: "pizza" },
        { name: "燻雞比薩", price: 80, type: "pizza" },
        { name: "總匯比薩", price: 80, type: "pizza" },
        { name: "夏威夷比薩", price: 80, type: "pizza" }
      ],
      drink: [
        { name: "厚奶茶", price: 65, type: "drink" },
        { name: "決明子紅萱", price: 60, type: "drink" },
        { name: "薰衣草奶茶", price: 75, type: "drink" },
        { name: "四季春茶", price: 60, type: "drink" },
        { name: "冬瓜茶", price: 60, type: "drink" },
        { name: "冬瓜檸檬", price: 70, type: "drink" }
      ],
      snack: [
        { name: "杏仁瓦片", price: 180, type: "snack" },
        { name: "法式千層蛋糕", price: 120, type: "snack" }
      ]
    };

    let orderHistory = JSON.parse(localStorage.getItem('qiaolai_orderHistory')) || [];
    let cart = {}; 
    let unlockCount = 0;
    let isEditMode = false;
    let tempNumpadStr = "0";

    function saveToLocalStorage() {
      localStorage.setItem('qiaolai_orderHistory', JSON.stringify(orderHistory));
      localStorage.setItem('qiaolai_menuData', JSON.stringify(menuData));
    }

    // 數位鍵盤控制函式
    function openNumpad() {
      const current = document.getElementById("cashGiven").value;
      tempNumpadStr = current === "" ? "0" : current;
      document.getElementById("numpadVal").innerText = tempNumpadStr;
      document.getElementById("numpadOverlay").style.display = "flex";
    }
    function closeNumpadBg(e) {
      if (e.target.id === "numpadOverlay") {
        document.getElementById("numpadOverlay").style.display = "none";
      }
    }
    function numPress(digit) {
      if (tempNumpadStr === "0") {
        tempNumpadStr = digit;
      } else {
        tempNumpadStr += digit;
      }
      document.getElementById("numpadVal").innerText = tempNumpadStr;
    }
    function numDelete() {
      if (tempNumpadStr.length > 1) {
        tempNumpadStr = tempNumpadStr.slice(0, -1);
      } else {
        tempNumpadStr = "0";
      }
      document.getElementById("numpadVal").innerText = tempNumpadStr;
    }
    function numClear() {
      tempNumpadStr = "0";
      document.getElementById("numpadVal").innerText = tempNumpadStr;
    }
    function confirmNumpad() {
      document.getElementById("cashGiven").value = tempNumpadStr === "0" ? "" : tempNumpadStr;
      document.getElementById("numpadOverlay").style.display = "none";
      calcChange();
    }

    function renderMenu() {
      for (let category in menuData) {
        const container = document.getElementById(category + "Menu");
        container.innerHTML = "";
        menuData[category].forEach(item => {
          const wrap = document.createElement("div");
          wrap.className = "menu-item-wrap";
          wrap.innerHTML = `
            <button class="btn btn-${category}" onclick="addToCart('${item.name}', ${item.price}, '${item.type}')">
              ${item.name} <span class="price-text">$${item.price}</span>
            </button>
            <input type="number" class="price-input" value="${item.price}" id="price_${item.name}" onchange="updatePrice('${item.name}', '${category}', this.value)">
          `;
          container.appendChild(wrap);
        });
      }
    }

    function checkUnlock() {
      unlockCount++;
      if (unlockCount >= 5) {
        isEditMode = !isEditMode;
        document.getElementById("menuPanel").classList.toggle("edit-mode", isEditMode);
        alert(isEditMode ? "已解鎖價格修改模式！可以直接在品項旁修改價格" : "已鎖定價格修改模式。");
        unlockCount = 0;
      }
    }

    function updatePrice(itemName, category, newPrice) {
      const p = parseInt(newPrice);
      if (isNaN(p) || p < 0) return;
      const target = menuData[category].find(i => i.name === itemName);
      if (target) {
        target.price = p;
        saveToLocalStorage();
        renderMenu();
        if (isEditMode) {
          document.getElementById("menuPanel").classList.add("edit-mode");
        }
      }
    }

    function addToCart(name, price, type) {
      if (cart[name]) {
        cart[name].qty += 1;
      } else {
        cart[name] = { price: price, qty: 1, type: type };
      }
      renderCart();
    }

    function changeQty(name, delta) {
      if (cart[name]) {
        cart[name].qty += delta;
        if (cart[name].qty <= 0) {
          delete cart[name];
        }
      }
      renderCart();
    }

    // 計算比薩與飲料配對折扣（限定同時有比薩與飲料才折 $10）
    function getDiscountInfo() {
      let pizzaCount = 0;
      let drinkCount = 0;
      for (let name in cart) {
        if (cart[name].type === 'pizza') pizzaCount += cart[name].qty;
        if (cart[name].type === 'drink') drinkCount += cart[name].qty;
      }
      const sets = Math.min(pizzaCount, drinkCount);
      const discount = sets * 10;
      return { sets, discount, pizzaCount, drinkCount };
    }

    function calculateTotal() {
      let total = 0;
      for (let name in cart) {
        total += cart[name].price * cart[name].qty;
      }
      const info = getDiscountInfo();
      total -= info.discount;
      return total < 0 ? 0 : total;
    }

    function renderCart() {
      const container = document.getElementById("cartList");
      container.innerHTML = "";

      const keys = Object.keys(cart);
      if (keys.length === 0) {
        container.innerHTML = `<p style="color: #a39283; text-align: center; margin-top: 60px; font-size: 1.3rem;">尚未選擇商品</p>`;
        document.getElementById("totalAmount").innerText = "0";
        document.getElementById("changeAmount").innerText = "$0";
        document.getElementById("comboHint").innerText = "未達比薩+飲料組合";
        return;
      }

      keys.forEach(name => {
        const item = cart[name];
        const div = document.createElement("div");
        div.className = "cart-item";
        div.innerHTML = `
          <div style="flex: 1;">
            <div style="font-weight: bold; font-size: 1.3rem;">${name}</div>
            <div style="font-size: 1.1rem; color: #8c7a6b; margin-top: 4px;">$${item.price} × ${item.qty} = $${item.price * item.qty}</div>
          </div>
          <div style="display: flex; align-items: center; gap: 10px;">
            <button class="btn" style="padding: 8px 16px; background: #e8dfd8; font-size: 1.3rem;" onclick="changeQty('${name}', -1)">-</button>
            <span style="font-weight: bold; width: 40px; text-align: center; font-size: 1.4rem;">${item.qty}</span>
            <button class="btn" style="padding: 8px 16px; background: #e8dfd8; font-size: 1.3rem;" onclick="changeQty('${name}', 1)">+</button>
          </div>
        `;
        container.appendChild(div);
      });

      const info = getDiscountInfo();
      const comboHintElem = document.getElementById("comboHint");
      if (info.sets > 0) {
        comboHintElem.innerText = `已折抵 ${info.sets} 組 (-$${info.discount})`;
        comboHintElem.style.color = "#a65d37";
      } else {
        comboHintElem.innerText = "需同時有比薩與飲料才能折$10";
        comboHintElem.style.color = "#8c7a6b";
      }

      const total = calculateTotal();
      document.getElementById("totalAmount").innerText = total;
      calcChange();
    }

    function calcChange() {
      const total = calculateTotal();
      const cash = parseFloat(document.getElementById("cashGiven").value) || 0;
      const change = cash - total;
      const changeElem = document.getElementById("changeAmount");
      if (change >= 0) {
        changeElem.innerText = `$${change}`;
        changeElem.style.color = "#6b8c73";
      } else {
        changeElem.innerText = `現金不足 ($${change})`;
        changeElem.style.color = "#b87b76";
      }
    }

    function setExactCash() {
      const total = calculateTotal();
      document.getElementById("cashGiven").value = total;
      calcChange();
    }

    function checkout() {
      const keys = Object.keys(cart);
      if (keys.length === 0) {
        alert("購物車是空的！");
        return;
      }
      const total = calculateTotal();
      const cash = parseFloat(document.getElementById("cashGiven").value) || 0;
      if (cash < total) {
        alert("收到的現金不足以支付總金額！");
        return;
      }

      const now = new Date();
      const timeStr = now.toTimeString().split(' ')[0];
      
      const order = {
        id: orderHistory.length > 0 ? orderHistory[orderHistory.length - 1].id + 1 : 1,
        time: timeStr,
        items: JSON.parse(JSON.stringify(cart)),
        total: total,
        status: "processing"
      };

      orderHistory.push(order);
      saveToLocalStorage();
      
      cart = {};
      document.getElementById("cashGiven").value = "";
      
      renderCart();
      renderQueue();
      updateDailyStatsHint();
    }

    function renderQueue() {
      const container = document.getElementById("queueList");
      if (orderHistory.length === 0) {
        container.innerHTML = `<p style="color: #a39283; text-align: center; margin-top: 60px; font-size: 1.3rem;">目前尚無訂單</p>`;
        return;
      }

      container.innerHTML = "";
      [...orderHistory].reverse().forEach(order => {
        const div = document.createElement("div");
        div.className = `queue-item ${order.status === 'done' ? 'queue-done' : ''}`;
        
        let itemsDesc = Object.entries(order.items).map(([name, info]) => `${name}x${info.qty}`).join(', ');

        div.innerHTML = `
          <div>
            <div style="font-weight: bold; font-size: 1.2rem; color: #5c4b42;">#${order.id} 訂單 (${order.time})</div>
            <div style="font-size: 1.1rem; color: #7c685b; margin: 6px 0;">${itemsDesc}</div>
            <div style="font-size: 1.2rem; color: #a65d37; font-weight: bold;">總計: $${order.total}</div>
          </div>
          <div>
            <button class="btn" style="background: ${order.status === 'done' ? '#a39283' : '#85a38b'}; color: white; padding: 10px 16px; font-size: 1.1rem;" onclick="toggleOrderStatus(${order.id})">
              ${order.status === 'done' ? '已完成' : '完成'}
            </button>
          </div>
        `;
        container.appendChild(div);
      });
    }

    function toggleOrderStatus(id) {
      const target = orderHistory.find(o => o.id === id);
      if (target) {
        target.status = target.status === 'done' ? 'processing' : 'done';
        saveToLocalStorage();
        renderQueue();
      }
    }

    function clearHistory() {
      if (confirm("確定要清空所有歷史訂單記錄嗎？")) {
        orderHistory = [];
        saveToLocalStorage();
        renderQueue();
        updateDailyStatsHint();
      }
    }

    function updateDailyStatsHint() {
      const totalRevenue = orderHistory.reduce((acc, cur) => acc + cur.total, 0);
      const totalOrders = orderHistory.length;
      document.getElementById("dailyStatsHint").innerText = `今日營業額: $${totalRevenue} | 總單數: ${totalOrders} 單`;
    }

    function autoFitColumns(ws) {
      const range = XLSX.utils.decode_range(ws['!ref']);
      let colWidths = [];
      for (let C = range.s.c; C <= range.e.c; ++C) {
        let maxLen = 10;
        for (let R = range.s.r; R <= range.e.r; ++R) {
          const cell = ws[XLSX.utils.encode_cell({r: R, c: C})];
          if (cell && cell.v !== undefined) {
            const valStr = String(cell.v);
            let len = 0;
            for (let i = 0; i < valStr.length; i++) {
              len += (valStr.charCodeAt(i) > 128) ? 2.2 : 1.2;
            }
            if (len > maxLen) maxLen = len;
          }
        }
        colWidths.push({ wch: Math.ceil(maxLen) + 4 });
      }
      ws['!cols'] = colWidths;
    }

    function exportExcel() {
      if (orderHistory.length === 0) {
        alert("目前尚無成交訂單可以匯出！");
        return;
      }

      const totalRevenue = orderHistory.reduce((acc, cur) => acc + cur.total, 0);
      const totalOrders = orderHistory.length;
      const avgOrderPrice = totalOrders > 0 ? (totalRevenue / totalOrders).toFixed(1) : 0;

      let itemSummary = {};
      orderHistory.forEach(order => {
        for (let name in order.items) {
          if (!itemSummary[name]) {
            itemSummary[name] = { 銷售數量: 0, 銷售金額: 0 };
          }
          itemSummary[name].銷售數量 += order.items[name].qty;
          itemSummary[name].銷售金額 += order.items[name].qty * order.items[name].price;
        }
      });

      let summaryData = [
        { "統計項目": "當日總營業額", "數值": `$${totalRevenue}` },
        { "統計項目": "當日總單數", "數值": `${totalOrders} 單` },
        { "統計項目": "平均客單價", "數值": `$${avgOrderPrice}` }
      ];

      let itemsData = [];
      for (let name in itemSummary) {
        itemsData.push({
          "品項名稱": name,
          "銷售數量": itemSummary[name].銷售數量,
          "銷售金額": itemSummary[name].銷售金額
        });
      }

      const wb = XLSX.utils.book_new();
      
      const wsSummary = XLSX.utils.json_to_sheet(summaryData);
      autoFitColumns(wsSummary);
      XLSX.utils.book_append_sheet(wb, wsSummary, "當日營運總覽");

      const wsItems = XLSX.utils.json_to_sheet(itemsData);
      autoFitColumns(wsItems);
      XLSX.utils.book_append_sheet(wb, wsItems, "品項銷售統計");

      const todayStr = new Date().toISOString().slice(0, 10);
      XLSX.writeFile(wb, `蕎淶清飲_營業報表_${todayStr}.xlsx`);
    }

    renderMenu();
    renderQueue();
    updateDailyStatsHint();
  </script>
</body>
